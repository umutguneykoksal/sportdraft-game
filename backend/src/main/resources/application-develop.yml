# Develop branch deploy (Railway develop/staging env, test.sportdraft.dev).
# Activate: SPRING_PROFILES_ACTIVE=develop
spring:
  config:
    activate:
      on-profile: develop
  data:
    redis:
      url: ${REDIS_URL}
  mvc:
    async:
      request-timeout: -1

spring.task:
  scheduling:
    pool:
      size: 4

app:
  admin:
    api-key: ${APP_ADMIN_API_KEY:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://test.sportdraft.dev,https://*.up.railway.app}
  session:
    disconnect-timeout-seconds: ${APP_SESSION_DISCONNECT_TIMEOUT_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}

logging:
  level:
    root: INFO
    dev.sportdraft: DEBUG
