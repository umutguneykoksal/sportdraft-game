spring:
  config:
    activate:
      on-profile: railway

management:
  otlp:
    tracing:
      enabled: ${OTLP_TRACING_ENABLED:false}
      endpoint: ${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
      headers:
        Authorization: ${OTLP_AUTH:}
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        headers:
          Authorization: ${OTLP_AUTH:}

logging:
  level:
    root: INFO
