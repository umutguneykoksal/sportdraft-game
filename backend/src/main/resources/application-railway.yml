spring:
  config:
    activate:
      on-profile: railway
  data:
    redis:
      url: ${REDIS_URL}

app:
  session:
    # 60s: pure gameplay decision (WebSocket removes proxy timeout constraint).
    # Gives a disconnected player ~60s to reconnect before forfeiting.
    disconnect-timeout-seconds: ${APP_SESSION_DISCONNECT_TIMEOUT_SECONDS:60}

management:
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}

logging:
  level:
    root: INFO
