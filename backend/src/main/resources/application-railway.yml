spring:
  config:
    activate:
      on-profile: railway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}

app:
  session:
    disconnect-timeout-seconds: ${APP_SESSION_DISCONNECT_TIMEOUT_SECONDS:20}

management:
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}

logging:
  level:
    root: INFO
