spring:
  config:
    activate:
      on-profile: production
  data:
    redis:
      url: ${REDIS_URL}
  mvc:
    async:
      # -1 = never time out; SSE uses long-lived response streams.
      request-timeout: -1

spring.task:
  scheduling:
    pool:
      size: 4

app:
  admin:
    api-key: ${APP_ADMIN_API_KEY:}
  session:
    # 60s: pure gameplay decision (WebSocket removes proxy timeout constraint).
    disconnect-timeout-seconds: ${APP_SESSION_DISCONNECT_TIMEOUT_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}

logging:
  level:
    root: INFO
    # Keep DEBUG for disconnect monitoring in prod; minimal overhead.
    com.example.auction.common.sse: INFO
    com.example.auction.common.realtime: INFO
    com.example.auction.session.control.SessionDisconnectCleanupScheduler: INFO
