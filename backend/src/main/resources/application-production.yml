spring:
  config:
    activate:
      on-profile: production
  data:
    redis:
      url: ${REDIS_URL}
  mvc:
    async:
      request-timeout: -1

spring.task:
  scheduling:
    pool:
      size: 4

app:
  session:
    disconnect-timeout-seconds: ${APP_SESSION_DISCONNECT_TIMEOUT_SECONDS:60}

management:
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}

logging:
  level:
    root: INFO
    com.example.auction.common.sse: DEBUG
    com.example.auction.session.control.SessionDisconnectCleanupScheduler: DEBUG
