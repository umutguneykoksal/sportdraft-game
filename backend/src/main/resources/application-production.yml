spring:
  config:
    activate:
      on-profile: production
  data:
    redis:
      url: ${REDIS_URL}

app:
  session:
    disconnect-timeout-seconds: ${APP_SESSION_DISCONNECT_TIMEOUT_SECONDS:20}

management:
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}

logging:
  level:
    root: INFO
