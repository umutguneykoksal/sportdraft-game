spring:
  config:
    activate:
      on-profile: production
  data:
    redis:
      url: ${REDIS_URL}
  mvc:
    async:
      # -1 = never time out; SSE uses long-lived response streams.
      request-timeout: -1

spring.task:
  scheduling:
    pool:
      size: 4

app:
  session:
    # 90 s gives reverse proxies (Railway, Nginx default 75 s) time to pass heartbeats
    # before we declare a forfeit. Must be > proxy idle timeout (≥ 75 s).
    disconnect-timeout-seconds: ${APP_SESSION_DISCONNECT_TIMEOUT_SECONDS:90}

management:
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}

logging:
  level:
    root: INFO
    # Keep DEBUG for disconnect monitoring in prod; minimal overhead.
    com.example.auction.common.sse: INFO
    com.example.auction.common.realtime: INFO
    com.example.auction.session.control.SessionDisconnectCleanupScheduler: INFO
