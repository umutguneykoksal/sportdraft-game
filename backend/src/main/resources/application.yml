spring:
  application:
    name: sportdraft
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auction_db}
    username: ${DB_USER:auction}
    password: ${DB_PASSWORD:auction}
  mvc:
    async:
      request-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    dev.sportdraft.common.sse: DEBUG
    dev.sportdraft.session.control.SessionDisconnectCleanupScheduler: DEBUG

spring.task:
  scheduling:
    pool:
      size: 4

app:
  admin:
    api-key: ${APP_ADMIN_API_KEY:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  session:
    disconnect-timeout-seconds: ${APP_SESSION_DISCONNECT_TIMEOUT_SECONDS:60}
    tournament-lobby-disconnect-timeout-seconds: ${APP_SESSION_TOURNAMENT_LOBBY_DISCONNECT_TIMEOUT_SECONDS:240}
    tournament-retention-seconds: ${APP_SESSION_TOURNAMENT_RETENTION_SECONDS:240}
  realtime:
    event-log-ring-size: ${APP_REALTIME_EVENT_LOG_RING_SIZE:10000}
    event-log-ttl-hours: ${APP_REALTIME_EVENT_LOG_TTL_HOURS:6}
  match-history:
    cleanup-enabled: ${APP_MATCH_HISTORY_CLEANUP_ENABLED:true}
    retention-days: ${APP_MATCH_HISTORY_RETENTION_DAYS:7}
    cleanup-cron: ${APP_MATCH_HISTORY_CLEANUP_CRON:0 0 4 * * *}
