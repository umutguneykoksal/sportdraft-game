spring:
  config:
    activate:
      on-profile: it
  main:
    banner-mode: off
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  task:
    scheduling:
      enabled: false
  data:
    redis:
      lettuce:
        pool:
          min-idle: 0
          max-active: 8

management:
  tracing:
    enabled: false

logging:
  level:
    root: WARN
    dev.sportdraft: INFO

app:
  session:
    disconnect-timeout-seconds: 1
