name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + IT)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Verify backend (Testcontainers Postgres + Redis)
        working-directory: backend
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

  e2e:
    name: Playwright E2E (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start Postgres and Redis
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose -f infra/docker-compose.yml exec -T postgres pg_isready -U auction && exit 0
            sleep 2
          done
          exit 1

      - name: Build and start backend
        working-directory: backend
        run: |
          mvn -q -DskipTests package
          nohup java -jar target/auction-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=local > ../backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 3
          done
          cat ../backend-e2e.log
          exit 1

      - name: Build and serve frontend
        working-directory: frontend
        env:
          REACT_APP_API_BASE: http://localhost:8080
        run: |
          npm ci
          npm run build
          npx --yes serve -s build -l 3000 > ../frontend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && exit 0
            sleep 2
          done
          cat ../frontend-e2e.log
          exit 1

      - name: Run Playwright duel smoke
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
